<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>The Terminal app with the Static Hands install line pasted in</title>
  <rect width="620" height="330" fill="#eef1f5"/>
  <!-- Spotlight -->
  <rect x="150" y="22" width="320" height="44" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <circle cx="176" cy="43" r="7" fill="none" stroke="#7a828e" stroke-width="2"/>
  <path d="M181 48l6 6" stroke="#7a828e" stroke-width="2" stroke-linecap="round"/>
  <text x="198" y="49" font-size="16" fill="#1f2630">Terminal</text>
  <text x="456" y="48" text-anchor="end" font-size="12" fill="#7a828e">⌘ Space</text>
  <!-- Terminal window -->
  <rect x="50" y="88" width="520" height="200" rx="12" fill="#1f2630"/>
  <path d="M50 100a12 12 0 0 1 12-12h496a12 12 0 0 1 12 12v22H50z" fill="#343c48"/>
  <circle cx="72" cy="105" r="6" fill="#ff5f57"/>
  <circle cx="92" cy="105" r="6" fill="#febc2e"/>
  <circle cx="112" cy="105" r="6" fill="#28c840"/>
  <text x="310" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#c9ced6">Terminal</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="68" y="152" fill="#25c2a0">you@mac ~ %</text>
    <text x="160" y="152" fill="#ffffff">curl -fsSL https://raw.githubusercontent.com/</text>
    <text x="68" y="172" fill="#ffffff">almogtavor/static-hands/main/mac/install.sh | bash</text>
    <rect x="436" y="161" width="8" height="14" fill="#ffffff"/>
  </g>
  <!-- callouts -->
  <rect x="68" y="204" width="150" height="38" rx="19" fill="#e5484d"/>
  <text x="143" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">1. Paste (⌘ V)</text>
  <rect x="236" y="204" width="150" height="38" rx="19" fill="#e5484d"/>
  <text x="311" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2. Press Enter</text>
  <text x="68" y="268" font-size="12" fill="#7a828e">The installer starts right away.</text>
</svg>
