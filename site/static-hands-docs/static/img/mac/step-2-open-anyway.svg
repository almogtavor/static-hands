<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>System Settings, Privacy and Security, with the Open Anyway button highlighted</title>
  <rect width="620" height="330" fill="#eef1f5"/>
  <rect x="40" y="26" width="540" height="278" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <!-- sidebar -->
  <path d="M40 38a12 12 0 0 1 12-12h138v278H52a12 12 0 0 1-12-12z" fill="#f1f2f5"/>
  <circle cx="60" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="80" cy="46" r="6" fill="#febc2e"/>
  <circle cx="100" cy="46" r="6" fill="#28c840"/>
  <g font-size="12" fill="#3b4048">
    <rect x="52" y="74" width="126" height="22" rx="6" fill="#e3e5ea"/>
    <text x="62" y="89" fill="#8a919c">Search</text>
    <text x="62" y="126">General</text>
    <text x="62" y="152">Appearance</text>
    <text x="62" y="178">Keyboard</text>
    <rect x="52" y="190" width="126" height="26" rx="6" fill="#2f6fed"/>
    <text x="62" y="207" fill="#ffffff" font-weight="600">Privacy &amp; Security</text>
    <text x="62" y="238">Notifications</text>
  </g>
  <!-- content -->
  <text x="212" y="54" font-size="16" font-weight="700" fill="#1f2630">Privacy &amp; Security</text>
  <text x="212" y="88" font-size="12" font-weight="600" fill="#7a828e">Security</text>
  <rect x="212" y="100" width="344" height="106" rx="10" fill="#f6f7f9" stroke="#e1e4e9"/>
  <text x="226" y="126" font-size="12.5" fill="#1f2630">“Install Static Hands.command” was blocked</text>
  <text x="226" y="144" font-size="12.5" fill="#1f2630">to protect your Mac.</text>
  <rect x="434" y="162" width="108" height="30" rx="7" fill="#ffffff" stroke="#c9ced6"/>
  <text x="488" y="182" text-anchor="middle" font-size="13" fill="#1f2630">Open Anyway</text>
  <rect x="428" y="156" width="120" height="42" rx="11" fill="none" stroke="#e5484d" stroke-width="3"/>
  <!-- callout -->
  <rect x="330" y="232" width="226" height="38" rx="19" fill="#e5484d"/>
  <text x="443" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Scroll down, click Open Anyway</text>
  <path d="M488 232v-26" stroke="#e5484d" stroke-width="3"/>
  <path d="M488 200l-8 14h16z" fill="#e5484d"/>
</svg>
